<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with blue gradient -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aed6f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="150" cy="150" r="140" fill="url(#blueGradient)" stroke="#2980b9" stroke-width="4"/>
  
  <!-- Lock body -->
  <rect x="100" y="160" width="100" height="80" rx="8" ry="8" fill="url(#lockGradient)" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Lock shackle -->
  <path d="M 120 160 L 120 130 Q 120 110 150 110 Q 180 110 180 130 L 180 160" 
        fill="none" stroke="url(#lockGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Lock keyhole -->
  <circle cx="150" cy="190" r="8" fill="#2980b9"/>
  <rect x="146" y="190" width="8" height="20" fill="#2980b9"/>
  
  <!-- Decorative dots for password field representation -->
  <circle cx="120" cy="220" r="4" fill="#3498db"/>
  <circle cx="135" cy="220" r="4" fill="#3498db"/>
  <circle cx="150" cy="220" r="4" fill="#3498db"/>
  <circle cx="165" cy="220" r="4" fill="#3498db"/>
  <circle cx="180" cy="220" r="4" fill="#3498db"/>
</svg>