<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with blue gradient -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="formGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aed6f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect x="20" y="20" width="260" height="260" rx="20" ry="20" fill="url(#blueGradient)" stroke="#2980b9" stroke-width="4"/>
  
  <!-- Form document -->
  <rect x="60" y="60" width="180" height="220" rx="8" ry="8" fill="url(#formGradient)" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Form header -->
  <rect x="70" y="70" width="160" height="30" rx="4" ry="4" fill="#3498db"/>
  
  <!-- User icon in header -->
  <circle cx="150" cy="85" r="8" fill="white"/>
  <path d="M 135 95 Q 135 90 150 90 Q 165 90 165 95 L 165 100 L 135 100 Z" fill="white"/>
  
  <!-- Form fields -->
  <rect x="80" y="120" width="140" height="15" rx="2" ry="2" fill="#85c1e9" opacity="0.7"/>
  <rect x="80" y="145" width="140" height="15" rx="2" ry="2" fill="#85c1e9" opacity="0.7"/>
  <rect x="80" y="170" width="140" height="15" rx="2" ry="2" fill="#85c1e9" opacity="0.7"/>
  <rect x="80" y="195" width="140" height="15" rx="2" ry="2" fill="#85c1e9" opacity="0.7"/>
  
  <!-- Field labels -->
  <circle cx="75" cy="127" r="2" fill="#2980b9"/>
  <circle cx="75" cy="152" r="2" fill="#2980b9"/>
  <circle cx="75" cy="177" r="2" fill="#2980b9"/>
  <circle cx="75" cy="202" r="2" fill="#2980b9"/>
  
  <!-- Submit button -->
  <rect x="100" y="230" width="100" height="25" rx="12" ry="12" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="150" y="247" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Register</text>
  
  <!-- Decorative pen/pencil -->
  <line x1="220" y1="180" x2="240" y2="160" stroke="#2980b9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="242" cy="158" r="3" fill="#3498db"/>
  <line x1="218" y1="182" x2="225" y2="175" stroke="#85c1e9" stroke-width="2"/>
</svg>